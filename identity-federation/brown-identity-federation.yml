caveats:
- >-
  SAML browser SSO is not API authentication. This contract is machine-readable and institution-
  operated, and it still gives a script or an agent no way to obtain credentials. See
  authentication/brown-authentication.yml.
- >-
  The self-published metadata carries no validUntil and its signing certificate dates from 2010 with
  a 2030 expiry. The InCommon aggregate entry is signed and expires 2026-09-13; consumers should
  prefer the MDQ entry.
