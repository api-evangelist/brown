description: >-
  Brown University's SAML 2.0 identity federation surface, and the strongest institution-operated
  machine-readable contract in this profile. Operator was settled by IP ownership and certificate
  subject rather than by hostname, which is the check that has repeatedly overturned university
  identity attributions elsewhere in this cohort — and here it CONFIRMS the institution verdict
  rather than overturning it.

  sso.brown.edu resolves to 128.148.252.212, netname BROWN-UNIV, OrgName "Brown University"
  (ARIN, BROWNU-Z), with no CNAME onto any managed-IdP platform. The TLS certificate is issued by
  InCommon RSA OV SSL CA 3 with subject `C=US, ST=Rhode Island, O=Brown University,
  CN=sso.brown.edu` — a Brown-procured OV certificate on Brown's own address space. This is Brown
  running Shibboleth on Brown hardware, not a tenant of a federation's managed service.

  Brown also SELF-PUBLISHES its per-entity metadata at the entityID URL, which is uncommon: most
  institutions leave their metadata to the federation aggregate and dereference the entityID to a
  login page. Both the self-published document and the InCommon-signed aggregate entry are archived
  in this directory.
