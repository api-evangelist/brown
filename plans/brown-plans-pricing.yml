plans:
- id: brown-free-open
  name: Free / Open
  type: free
  description: >-
    The Brown Digital Repository REST API and its IIIF Image and Presentation services — Brown's only
    institution-operated public APIs. Keyless, unregistered, free. Rights on the OBJECTS the API
    returns vary per item and are carried in each object's MODS access-condition fields; the API
    itself carries no terms of its own.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: brown-affiliation
  name: Affiliation / Credentialed
  type: free
  description: >-
    The Brown-affiliate view of the repository, reached through the Shibboleth SSO that every search
    response points at, plus the SAML federation membership itself. Gated by institutional identity,
    not by payment, and not usable by software — there is no token endpoint, no OAuth server and no
    service account.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
