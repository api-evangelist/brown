description: >-
  Brown University is a non-commercial higher-education institution and sells no API. There is no
  pricing page, no plan table, no quota tier and nothing to sign up for. Corrected on 2026-08-30: the
  2026-06-03 version described "library, repository, course, and open-metadata interfaces" as Brown's
  free public APIs. Only the repository interface is Brown's. Course data reaches the public through
  a Leepfrog CourseLeaf tenant and library discovery through an Ex Libris Primo VE tenant; both are
  free to the caller and neither is Brown's engineering, so neither belongs in Brown's plan
  inventory. There is no open-metadata interface at all — no OAI-PMH endpoint exists.
notes: >-
  "Free / Open" is the whole commercial story for Brown's institution-operated surface, and it is
  literal: https://repository.library.brown.edu/api/search/?q=*&rows=1 returned HTTP 200 with a full
  result set and no credential on 2026-08-30. "Affiliation / Credentialed" describes the Brown-only
  view behind Shibboleth that every search response advertises through its links.login key; that is
  browser SSO, gated by institutional identity rather than by payment, and it issues no API
  credential.
sources:
- https://raw.githubusercontent.com/api-evangelist/brown/refs/heads/main/apis.yml
