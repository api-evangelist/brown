specification: API Evangelist Lifecycle
specificationVersion: '0.1'
provider: Brown University
providerId: brown
generated: '2026-08-30'
method: derived
probed: '2026-08-30'
method_note: >-
  Authored by API Evangelist from live probes on 2026-08-30, not published by Brown. `derived` is the
  authorship class the catalog's provenance manifest reads; the probe evidence itself is in `source`
  and in the per-finding `evidence` blocks below.
source:
- https://github.com/Brown-University-Library/bdr_api_documentation/wiki
- https://github.com/Brown-University-Library
- https://repository.library.brown.edu/api/
- https://api.students.brown.edu
description: >-
  Versioning, change communication and deprecation posture for Brown's institution-operated surfaces.
  The honest summary is that there is no lifecycle programme: no version in any URL or header, no
  changelog, no deprecation policy, no status page, no announcement channel for API consumers. What
  exists instead is a GitHub repository whose wiki is edited when something changes, which is a real
  and observable signal and is more than most institutions in this cohort offer.
versioning:
  scheme: none
  in_path: false
  in_header: false
  in_media_type: false
  note: >-
    `/api/search/`, `/api/items/{pid}/` and `/api/collections/` carry no version segment. The IIIF
    surface is versioned by the IIIF community specification it implements (Image API 2.x,
    Presentation API 2.x, both declared in the `@context` of every response) — that is IIIF's
    versioning, not Brown's.
change_communication:
  channel: GitHub wiki
  url: https://github.com/Brown-University-Library/bdr_api_documentation/wiki
  observed: '2026-08-30'
  note: >-
    Seven revisions, most recently 2026-05-27, authored by named Brown Library staff. The Spring 2025
    introduction of Cloudflare bot protection — a genuinely breaking change for high-volume API
    consumers — was communicated here and, as far as any probe can tell, nowhere else. There is no
    feed, no mailing list and no in-band header; a consumer learns about a change by re-reading a
    wiki page.
  issue_tracker: https://github.com/Brown-University-Library/bdr_api_documentation/issues
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: No deprecation policy, no RFC 8594 Sunset header, no Deprecation header observed.
status_page:
  published: false
  note: No status or uptime page was found for the BDR or for any Brown API surface.
evidenced_retirements:
- surface: api.students.brown.edu
  status: dead
  evidence:
    status: 404
    first_recorded: '2026-06-03'
  note: >-
    A student-built course/registrar backend associated with Hack@Brown. Recorded in this repo's own
    2026-06-03 review as already 404 and deliberately not catalogued as a live API. It is kept here as
    a lifecycle fact: the one course-data API that ever ran on a Brown hostname was student-built and
    was retired with no announcement, which is why Brown's course data now reaches the public only
    through a vendor platform.
reversibility:
  documented: false
  note: >-
    No documented path to export, delete or withdraw. Not applicable in the usual sense — the BDR API
    is read-only and holds no consumer-supplied data — but deposit into the repository is a
    Brown-staff workflow outside the API, and its retention terms are not published on this surface.
