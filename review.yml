- date: '2026-08-30'
  rating: 4
  pipeline: university
  summary: >-
    Full re-profile under the university pipeline, with operator attribution settled before anything
    was saved. Brown came through the audit clean — no vendor contract had been attributed to it, so
    nothing had to be removed. What the re-profile added is the contract work the June 2026 pass did
    not do: two derived OpenAPI documents for the surfaces Brown actually operates, eleven JSON
    Schemas, seven captured example payloads, a Solr field vocabulary, an errors artifact, an
    authentication artifact, a lifecycle artifact, a Spectral ruleset that was actually run, a
    conformance artifact against the education regime, and an identity-federation artifact with both
    SAML metadata documents archived.

    Three surfaces are institution-operated and were confirmed by address ownership rather than by
    hostname. sso.brown.edu resolves to 128.148.252.212 (netname BROWN-UNIV, Brown University, ARIN)
    behind a TLS certificate whose subject is "O=Brown University" issued by InCommon's OV CA — the
    same check that reclassified Monash's and Melbourne's identity providers as tenant surfaces, and
    Brown passes it. The BDR is Brown University Library software, published open source in Brown's
    own GitHub org and registered with DataCite as client BROWN.BDR.

    Four surfaces are tenant relationships and were recorded rather than credited: Ex Libris Primo VE
    (bruknow.library.brown.edu terminates on Ex Libris (USA) Inc address space), Leepfrog CourseLeaf
    twice (cab.brown.edu, bulletin.brown.edu), and LiveWhale (events.brown.edu). Two of them serve
    substantial keyless public JSON that would have inflated Brown's apparent footprint considerably
    if attributed to the institution — Courses@Brown returns full course-section data on a POST API,
    Events@Brown a 3MB JSON feed plus an iCal feed.

    Three corrections were made to existing artifacts. The rate-limits artifact had advised honoring
    throttling on OAI-PMH endpoints; Brown has none, on any of seven probed paths, so the guidance
    was describing a surface that does not exist. The plans artifact listed course and open-metadata
    interfaces among Brown's free public APIs; both are tenant or nonexistent. The deliveryModel
    block read commercial:true, open_source:false, callable_host:false — all three wrong.

    Direction of travel: this re-profile should RAISE Brown's composite, and unusually for this
    cohort that is legitimate rather than a misattribution artifact. It rises because Brown genuinely
    operates a live keyless API that had no contract, no schemas and no examples in the repo, not
    because someone else's contract was attributed to it.
