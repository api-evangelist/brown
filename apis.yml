    url: https://bulletin.brown.edu/
  x-operator: tenant
  x-operator-basis: >-
    bulletin.brown.edu CNAMEs to brown-public.courseleaf.com, resolving to 12.175.6.47 (AT&T
    Enterprises, LLC). CourseLeaf CAT, Leepfrog Technologies.
- aid: brown:events
  name: Events@Brown (LiveWhale Calendar tenant)
  description: >-
    Brown's university-wide events calendar, serving a public JSON feed at /live/json/events
    (3,128,496 bytes on 2026-08-30) and an iCalendar feed at /live/ical/events (2,101,266 bytes,
    RFC 5545, PRODID //Events@Brown//NONSGML v1.0//EN). Both keyless and live. The events are Brown's;
    the feed format and the platform are White Whale Web Services' LiveWhale.
  humanURL: https://events.brown.edu/
  baseURL: https://events.brown.edu/live/
