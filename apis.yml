    url: https://github.com/Brown-University-Library
  x-operator: institution
  x-operator-basis: >-
    repository.library.brown.edu is under brown.edu, Brown's own registrable domain. The repository
    application is Brown University Library software published as open source in Brown's own GitHub
    organization (bdr_indexer, bdrxml, bdr_uploader_hub_project, bdr-api-tools), the API
    documentation is authored by named Brown Library staff in Brown's own GitHub wiki, and DataCite
    registers the repository as Brown's client BROWN.BDR with 14,089 DOIs under prefix 10.26300. No
    vendor identity appears in the host, the responses or the docs. Cloudflare fronts the host as a
    CDN and bot-protection layer, which is delivery, not operation.
- aid: brown:bdr-iiif
  name: Brown Digital Repository IIIF Image and Presentation API
  description: >-
    The BDR's IIIF surface, on the same institution-operated host. IIIF Image API 2.x (info.json
    reports a 6335x8560 source with a seven-step size pyramid and 512x512 tiles for the probed
    object) and IIIF Presentation API 2.x (sc:Manifest with a metadata block projected from the
    object's MODS record). Both are version 2.x; IIIF Presentation 3.0 has been the recommendation
    since 2020 and Brown has not migrated. The paths are not advertised anywhere and /iiif is
    disallowed in the repository's robots.txt — the documented route in is the item API's
    links.views.iiif_image_info and links.views.iiif_manifest keys. Brown is a IIIF community case
    study.
  humanURL: https://iiif.io/guides/guides/repository.library.brown.edu/
  baseURL: https://repository.library.brown.edu/iiif/
  tags:
  - IIIF
