x-coverage:
  state: covered
  reason: covered
  detail: >-
    Brown publishes a real, institution-operated, live, keyless API and this profile documents it
    from probes rather than from links. Three institution surfaces were confirmed and attributed by
    address ownership, not hostname: the BDR REST API and its IIIF services on
    repository.library.brown.edu, and the Shibboleth IdP on sso.brown.edu, which resolves into
    BROWN-UNIV (ARIN) behind a Brown-subject InCommon OV certificate. Brown publishes no OpenAPI, so
    both contracts here are marked derived; every path, parameter and status code in them was
    reconciled against Brown's own prose documentation and a live probe.

    Four tenant relationships are recorded and deliberately not credited as Brown engineering: Ex
    Libris Primo VE (bruknow.library.brown.edu terminates on Ex Libris (USA) Inc address space),
    Leepfrog CourseLeaf twice (cab.brown.edu and bulletin.brown.edu), and LiveWhale
    (events.brown.edu). Two of them serve substantial public JSON — Courses@Brown returns full
    section data keyless, Events@Brown a 3MB feed plus iCal — which is exactly the pattern this
    pipeline exists to keep out of an institution's score.

    Named absences, all probed rather than assumed: no OAI-PMH endpoint on seven candidate paths, no
    ORCID identifiers in the repository index, no open data portal (data.brown.edu does not resolve),
    no api.brown.edu, no developer.brown.edu, no llms.txt, no security.txt, no OAuth or OIDC of any
    kind, and no institution-operated course or registrar API. Brown is a registered DataCite
    consortium organization with an active repository client and 11,622 DOI-bearing objects in the
    public index, which is the strongest domain-standard evidence in the profile alongside
    SAML/Shibboleth.

    One partial block, recorded because it is about us, not about Brown: the human documentation
    surface at repository.library.brown.edu/studio/ — including the /studio/api-docs/ page — serves a
    Cloudflare Turnstile interstitial under HTTP 200 to non-browser clients. The JSON API endpoints
    behind it are entirely open. That is the inverse of the usual pattern, and it means the
    APIReference pointer in common[] reads live to a browser and is unreadable to an agent. Brown's
    own GitHub wiki carries the same documentation without a challenge, and is used here as the
    primary documentation pointer.
