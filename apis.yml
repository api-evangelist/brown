aid: brown
name: Brown University
x-type: university
x-category: Private Research University
description: >-
  Brown University is a private Ivy League research university in Providence, Rhode Island. Its
  genuinely institution-operated programmable footprint is narrow, real, and concentrated entirely in
  the Brown University Library. Three surfaces survive an operator check: the Brown Digital Repository
  (BDR) REST API, the BDR's IIIF Image and Presentation services, and a Shibboleth SAML 2.0 identity
  provider. All three sit under brown.edu, and the identity provider resolves into Brown's own ARIN
  allocation (BROWN-UNIV, 128.148.252.0/24) behind a Brown-procured InCommon OV certificate, so the
  attribution is settled by address ownership rather than by hostname.

  The BDR API is the substantive find: a public, keyless, Solr-backed API over 1,147,400 objects,
  documented by Brown Library staff in the wiki of Brown's own GitHub repository, with 11,622 objects
  exposing DataCite DOIs on Brown's prefix 10.26300. It is more than most universities in this cohort
  operate. It is also unversioned, sends no CORS headers, returns nine-byte text/html bodies on
  failure, silently caps results at 500 rows, and answers malformed queries with HTTP 200 and an
  empty result set rather than the 400 its own documentation promises. There is no OAI-PMH endpoint
  on any probed path — an absence worth stating, because reviewers assume an institutional repository
  has one.

  Everything else that looks like a Brown API is a vendor platform running under a Brown hostname and
  is recorded here as a tenant relationship, not as a Brown contract: library discovery is Ex Libris
  Primo VE (bruknow.library.brown.edu terminates on Ex Libris (USA) Inc address space), the course
  catalog and bulletin are Leepfrog CourseLeaf (cab.brown.edu and bulletin.brown.edu CNAME to
  courseleaf.com), and the events calendar is LiveWhale (events.brown.edu CNAMEs to lwcal.com). Two of
  those tenant platforms expose genuinely useful public JSON — Courses@Brown returns full section,
  meeting-time and instructor data with no key, and Events@Brown serves a 3MB JSON feed and an iCal
  feed — but that engineering is the vendor's. No central developer portal, no open data portal, and
  no institution-operated course or registrar API exist; the one that did, the student-built
  api.students.brown.edu, has been 404 since before this profile was first written.
