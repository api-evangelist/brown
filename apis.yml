- aid: brown:cab
  name: Courses@Brown (Leepfrog CourseLeaf tenant)
  description: >-
    Brown's course search and registration front end. It exposes a live, public, keyless JSON API at
    cab.brown.edu/api/ — a POST interface with page=fose routes for search and details that returned
    393 course sections with CRNs, meeting times, instructors, enrolment caps and grade-mode options
    for a single keyword query on 2026-08-30. This is by some distance the richest machine-readable
    Brown data on the public internet, and it is not Brown's engineering: the host is a CourseLeaf
    tenant and the fose search interface is Leepfrog's product. Recorded as a tenant relationship;
    no CourseLeaf contract is saved under this slug. Brown operates no course or registrar API of its
    own — the student-built api.students.brown.edu that once did has been 404 since before this
    profile was written.
  humanURL: https://cab.brown.edu/
  baseURL: https://cab.brown.edu/api/
  tags:
  - Course Catalog
  - Registrar
  - Student Information
  properties:
  - type: CourseCatalog
    url: https://cab.brown.edu/
  x-operator: tenant
  x-operator-basis: >-
    cab.brown.edu CNAMEs to brown-fs.courseleaf.com and on to brown-fs.courseleafaws.com, resolving
    to 18.221.164.147 (Amazon Technologies Inc., AT-88-Z). CourseLeaf is Leepfrog Technologies'
    product; the ?page=fose&route=search POST interface is theirs, deployed identically across their
    customer base.
- aid: brown:bulletin
  name: Brown University Bulletin (Leepfrog CourseLeaf CAT tenant)
  description: >-
    The university's academic catalog of programs, concentrations and requirements, on the same
    vendor as Courses@Brown but a separate deployment. Human-readable; no public JSON interface was
    found on it.
  humanURL: https://bulletin.brown.edu/
  baseURL: https://bulletin.brown.edu/
  tags:
  - Course Catalog
