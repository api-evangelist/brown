apis:
- aid: brown:bdr-api
  name: Brown Digital Repository (BDR) API
  description: >-
    The Brown University Library's public, keyless REST API over the Brown Digital Repository — an
    item API, a collection API, a Solr-backed search API, and a two-key link index at /api/. Live and
    unauthenticated on 2026-08-30 against an index of 1,147,400 public objects. Brown documents it
    itself, in prose, in the wiki of its own Brown-University-Library/bdr_api_documentation GitHub
    repository; there is no Brown-published OpenAPI, so the contract in this repo is derived and
    marked as such. Notable behaviours, all probed: rows is silently clamped to 500, malformed
    queries return 200 rather than the documented 400, unknown PIDs return a nine-byte text/html
    "Not Found" rather than the documented 403, no CORS headers are sent (JSONP via a callback
    parameter is the documented cross-origin path), and Cloudflare bot protection added in Spring
    2025 fronts the host.
  humanURL: https://github.com/Brown-University-Library/bdr_api_documentation/wiki
  baseURL: https://repository.library.brown.edu/api/
  tags:
  - Digital Repository
  - Research Repository
  - Library
  - Search
  - Research Data
  - JSON
  properties:
